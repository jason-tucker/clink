# Builds Clink.exe and publishes a GitHub release when a v*.*.* tag is pushed
# (tools/release.ps1 does that). Run it by hand from the Actions tab to release
# whatever <Version> Clink/Clink.csproj currently says; it refuses if that
# version is already tagged, so an existing release is never overwritten.
#
# The in-app updater downloads the asset named exactly "Clink.exe" and checks it
# against the first 64-hex token of "Clink.exe.sha256", so keep those names.
#
# Every action is pinned to a commit SHA (the version is in the comment): this
# job holds contents:write and whatever code those actions run controls the
# update channel. Dependabot (.github/dependabot.yml) proposes bumps.
name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - name: Determine version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $match = Select-String -Path Clink/Clink.csproj -Pattern '<Version>([^<]+)</Version>' | Select-Object -First 1
          if (-not $match) { throw 'No <Version> element in Clink/Clink.csproj' }
          $csprojVersion = $match.Matches[0].Groups[1].Value.Trim()
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF_NAME.Substring(1)
            if ($version -ne $csprojVersion) {
              Write-Output "::warning::Tag is $env:GITHUB_REF_NAME but Clink.csproj says <Version>$csprojVersion</Version>; building as $version."
            }
          } else {
            $version = $csprojVersion
            # A manual run must not attach a different binary to a release that already exists.
            $eap = $ErrorActionPreference
            $ErrorActionPreference = 'Continue'            # gh's stderr must not abort the step before we look at it
            $PSNativeCommandUseErrorActionPreference = $false
            $probe = (& gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/v$version" 2>&1 | Out-String)
            $exists = $LASTEXITCODE -eq 0
            $ErrorActionPreference = $eap
            if ($exists) { throw "v$version is already released; bump <Version> in Clink/Clink.csproj first." }
            if ($probe -notmatch 'HTTP 404') { throw "Could not check whether tag v$version exists: $probe" }
          }
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$') { throw "'$version' is not a valid version (expected X.Y.Z)" }
          $prerelease = if ($version.Contains('-')) { 'true' } else { 'false' }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "prerelease=$prerelease"
          Write-Output "Building Clink $version (prerelease: $prerelease)"

      - name: Publish
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          UPDATE_REPO: ${{ github.repository }}
        run: |
          dotnet publish Clink/Clink.csproj -c Release -o dist "-p:Version=$env:VERSION" "-p:UpdateRepo=$env:UPDATE_REPO"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path dist/Clink.exe)) { throw 'dist/Clink.exe was not produced' }
          Get-ChildItem dist | Select-Object Name, Length

      - name: Write Clink.exe.sha256
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Path dist/Clink.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $path = Join-Path (Get-Location) 'dist/Clink.exe.sha256'
          [System.IO.File]::WriteAllText($path, "$hash *Clink.exe`n", [System.Text.UTF8Encoding]::new($false))
          Get-Content $path

      - name: Create GitHub release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Clink v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/Clink.exe
            dist/Clink.exe.sha256
