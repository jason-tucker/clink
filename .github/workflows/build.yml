# Compiles Clink and runs its unit tests (Clink.exe --unittest) on every push to
# main and on pull requests. Releases are built separately by release.yml.
# Actions are pinned to commit SHAs (version in the comment); Dependabot
# (.github/dependabot.yml) proposes bumps.
name: Build

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Build
        shell: pwsh
        run: dotnet build Clink/Clink.csproj -c Release

      # Clink.exe is a GUI-subsystem exe: Start-Process -Wait -PassThru -NoNewWindow
      # is what shows its output and gives its exit code. CLINK_TESTS_NO_SKIP is left
      # unset on purpose: the audio mix render tests skip (they do not fail) on a
      # runner that has no AAC encoder.
      - name: Unit tests
        shell: pwsh
        timeout-minutes: 10
        run: |
          $exe = Get-ChildItem -Path Clink/bin/Release -Filter Clink.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw 'Clink.exe was not found under Clink/bin/Release' }
          $run = Start-Process -FilePath $exe.FullName -ArgumentList '--unittest' -Wait -PassThru -NoNewWindow
          if ($run.ExitCode -ne 0) { throw "Unit tests failed (exit code $($run.ExitCode))" }
